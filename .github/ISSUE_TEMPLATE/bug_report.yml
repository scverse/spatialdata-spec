name: Spec issue / ambiguity report
description: Report an ambiguity, inconsistency, or error in the specification
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        <!-- TODO: expand this template once the spec contribution workflow is defined. -->
        Thanks for helping improve the SpatialData specification.
  - type: textarea
    id: location
    attributes:
      label: Affected section
      description: Which part of the spec is affected? Include the spec version and a heading or link.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is ambiguous, inconsistent, or incorrect, and what would you expect instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Implementations and examples
      description: Which implementation(s) and version(s) are affected? Link to data or an on-disk example if you can.
    validations:
      required: false
