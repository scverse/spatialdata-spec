name: Publish

# On every push to history-draft: write each version of the specification to main
# (tools/write_history.py; one commit and tag storage-format-<version> per new version), then
# build every version listed in versions.toml on the site branch and deploy it to GitHub Pages.
# The site branch runs this workflow after each push to it. This workflow lives on the default
# branch, because main holds Markdown and images only.

on:
  push:
    branches: [history-draft]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  history:
    name: Write the versions to main
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes main and the version tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: history-draft
          fetch-depth: 0 # main and the tags
          persist-credentials: true # zizmor: ignore[artipacked] the next steps push
      - name: Write new versions to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin main:main
          python3 tools/write_history.py
      - name: Push main and the version tags
        run: git push origin main 'refs/tags/storage-format-*'

  build:
    name: Build all versions
    needs: history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: site
          filter: blob:none
          fetch-depth: 0 # build.py checks out every published branch and tag
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false # no cache in a job that publishes
      - name: Build every version (warnings treated as errors)
        run: uv run build.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
