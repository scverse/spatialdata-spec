name: Site

# Builds every version listed in versions.toml (the tags of main) and, on a push to this branch,
# deploys the site to GitHub Pages. Releasing a version means adding its tag to versions.toml here,
# so a push to this branch is what publishes it; main holds Markdown and images only.

on:
  push:
    branches: [site]
  pull_request:
    branches: [site]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - &clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0 # build.py checks out every published branch and tag
          persist-credentials: false
      - &setup-uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx prek run --all-files --show-diff-on-failure --color=always

  build:
    name: Build all versions
    runs-on: ubuntu-latest
    steps:
      - *clone
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false # no cache in a job that publishes
      - name: Build every version in versions.toml (warnings treated as errors)
        run: uv run build.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  deploy:
    name: Deploy to GitHub Pages
    needs: [lint, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
