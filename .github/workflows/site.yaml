name: Site

# Checks changes to the website code. Publishing runs from the default branch (publish.yaml there),
# because pushes to main and tags run main's workflows; a push to this branch asks it to republish.

on:
  push:
    branches: [site]
  pull_request:
    branches: [site]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - &clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0 # build.py checks out every published branch and tag
          persist-credentials: false
      - &setup-uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx prek run --all-files --show-diff-on-failure --color=always

  build:
    name: Build all versions
    runs-on: ubuntu-latest
    steps:
      - *clone
      - *setup-uv
      - name: Build every version in versions.toml (warnings treated as errors)
        run: uv run build.py
      - name: Upload built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-html
          path: _site/
          if-no-files-found: error
          retention-days: 14

  republish:
    name: Republish the site
    needs: [lint, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run publish.yaml on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run publish.yaml --ref "$DEFAULT_BRANCH"
