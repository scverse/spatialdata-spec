name: Preview

# Deploys the website with this branch as its RFCs to Cloudflare Pages, by the workflow preview.yaml
# of the branch site: every push at https://spatialdata-spec.pages.dev/, every pull request against
# this branch at https://pr-<number>.spatialdata-spec.pages.dev/, which the pull request links as a
# deployment ("View deployment").

on:
  push:
    branches: [rfcs]
  pull_request:
    branches: [rfcs]

permissions:
  contents: read

jobs:
  preview:
    # the website code as it is now, in this repository: not pinned on purpose
    uses: scverse/spatialdata-spec/.github/workflows/preview.yaml@site # zizmor: ignore[unpinned-uses]
    with:
      content: rfcs
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
