name: Preview

# On every push to this branch, runs site.yaml of the branch site (workflow_dispatch), which
# deploys the published site, https://spatialdata-spec.scverse.org, with this branch's current
# state. Every pull request against this branch: deploys the website with this branch as
# its RFCs to https://pr-<number>.spatialdata-spec.pages.dev/ (Cloudflare
# Pages), by the workflow preview.yaml of the branch site; the pull request links it as a
# deployment ("View deployment").

on:
  push:
    branches: [rfcs]
  pull_request:
    branches: [rfcs]

permissions:
  contents: read

jobs:
  site:
    name: Deploy the site
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write # workflow_dispatch of site.yaml
    steps:
      - run: gh workflow run site.yaml --repo "$GITHUB_REPOSITORY" --ref site
        env:
          GH_TOKEN: ${{ github.token }}

  preview:
    if: github.event_name == 'pull_request'
    # the website code as it is now, in this repository: not pinned on purpose
    uses: scverse/spatialdata-spec/.github/workflows/preview.yaml@site # zizmor: ignore[unpinned-uses]
    with:
      content: rfcs
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
