name: Preview

# Deploys the website with this branch as the Python in-memory format to Cloudflare Pages, by the
# workflow preview.yaml of the branch site: every push at https://spatialdata-spec.pages.dev/, every
# pull request against this branch at https://pr-<number>.spatialdata-spec.pages.dev/, which the
# pull request links as a deployment ("View deployment").
# Until scverse/spatialdata-spec#65 (in-memory formats on the website) is merged, the workflow of
# its branch and website code (site_ref) are used; afterwards @site, like the other branches.

on:
  push:
    branches: [in-memory-python]
  pull_request:
    branches: [in-memory-python]

permissions:
  contents: read

jobs:
  preview:
    # the website code as it is now, in this repository: not pinned on purpose
    uses: scverse/spatialdata-spec/.github/workflows/preview.yaml@jan-glx/site-in-memory-python # zizmor: ignore[unpinned-uses]
    with:
      content: in-memory-python
      site_ref: jan-glx/site-in-memory-python # until #65 is merged; then drop this line
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
