name: Preview

# Builds the whole site for a pull request against this branch and deploys it to Cloudflare Pages,
# at https://pr-<number>.spatialdata-spec.pages.dev/; the pull request links it as a deployment
# ("View deployment"). The published site is deployed to GitHub Pages by site.yaml, not from here.
# Needs the secrets CLOUDFLARE_API_TOKEN (permission: Cloudflare Pages, Edit) and
# CLOUDFLARE_ACCOUNT_ID in the environment "preview", and a Pages project "spatialdata-spec".

on:
  pull_request:
    branches: [site]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Build and deploy a preview
    # secrets are not available to pull requests from forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}.spatialdata-spec.pages.dev/
    env:
      # links between versions are absolute: they lead to the preview itself
      SITE_URL: https://pr-${{ github.event.pull_request.number }}.spatialdata-spec.pages.dev/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build.py checks out every published branch and tag
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false # no cache in a job that deploys
      - name: Build every version in versions.toml
        run: uv run build.py
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: npx --yes wrangler@4.149.0 pages deploy _site --project-name=spatialdata-spec --branch="pr-$PR"
