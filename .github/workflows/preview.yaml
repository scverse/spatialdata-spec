name: Preview

# Deploys a preview of the Python in-memory format to Cloudflare Pages: every pull request against
# this branch at https://pr-<number>.spatialdata-spec.pages.dev/, which the pull request links as a
# deployment ("View deployment"), every push at https://in-memory-python.spatialdata-spec.pages.dev/.
# The website (branch site) does not build in-memory formats yet, so this workflow does not call
# its preview workflow: it builds one preview with site's build.py from the current storage format
# (branch storage-format) and the pages of this commit, which the root of the deployment leads to.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, as site's.

on:
  push:
    branches: [in-memory-python]
  pull_request:
    branches: [in-memory-python]

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    # secrets are not available to pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'site-preview' }}
      url: ${{ env.SITE_URL }}preview/in-memory-python.html
    env:
      # branch of the Pages project, each at its own URL
      BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'in-memory-python' }}
      SITE_URL: ${{ github.event_name == 'pull_request' && format('https://pr-{0}.spatialdata-spec.pages.dev/', github.event.pull_request.number) || 'https://in-memory-python.spatialdata-spec.pages.dev/' }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out the website code (branch site)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: site
          fetch-depth: 0 # build.py reads the branches data-model and storage-format
          persist-credentials: false
      - name: Check out the content (this commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .content
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false # no cache in a job that deploys
      - name: Put the pages of this commit next to the current storage format
        run: |
          mkdir _src
          git archive origin/storage-format | tar -x -C _src
          cp .content/in-memory-python*.md _src/
          python - <<'EOF'
          from pathlib import Path

          # list the Python in-memory format in the navigation, next to the storage format's pages
          page = Path("_src/storage-format.md")
          anchor = "Version history <storage-format-versions>\n"
          text = page.read_text()
          assert anchor in text, "storage-format.md: toctree entry not found"
          page.write_text(text.replace(anchor, anchor + "Python in-memory format <in-memory-python>\n"))
          EOF
      - name: Build the preview
        run: uv run build.py --source _src --pr "$PR"
      - name: Lead the root to the Python in-memory format; keep the deployment out of search engines
        run: |
          printf '<!doctype html>\n<meta charset="utf-8">\n<meta http-equiv="refresh" content="0; url=preview/in-memory-python.html">\n<a href="preview/in-memory-python.html">Python in-memory format</a>\n' > _site/index.html
          printf '/*\n  X-Robots-Tag: noindex\n' > _site/_headers
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 pages deploy _site --project-name=spatialdata-spec --branch="$BRANCH"
