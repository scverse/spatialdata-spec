name: Preview

# Builds the whole site, with the content of the branch history-draft (tools/write_history.py
# --out), and deploys it to Cloudflare Pages: every push to this branch or to history-draft at
# https://spatialdata-spec.pages.dev/ (the current state), every pull request against either at
# https://pr-<number>.spatialdata-spec.pages.dev/, which the pull request links as a deployment
# ("View deployment"). history-draft runs this workflow too, with content: true. Neither is the
# published site, which site.yaml deploys to GitHub Pages; both are kept out of search engines.
# Once history-draft is gone, the content comes from the tags of main again (versions.toml).
# Needs the repository secrets CLOUDFLARE_API_TOKEN (permission: Cloudflare Pages, Edit) and
# CLOUDFLARE_ACCOUNT_ID, and a Pages project "spatialdata-spec" whose production branch is site.

on:
  push:
    branches: [site]
  pull_request:
    branches: [site]
  workflow_call:
    inputs:
      content:
        description: true when run for history-draft, whose commit is then the content
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    # secrets are not available to pull requests from forks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'site-preview' || 'preview' }}
      url: ${{ env.SITE_URL }}
    env:
      # branch of the Pages project: site (production) or pr-<number>, each at its own URL
      BRANCH: ${{ github.event_name == 'push' && 'site' || format('pr-{0}', github.event.pull_request.number) }}
      # links between versions are absolute: they lead to this deployment itself
      SITE_URL: ${{ github.event_name == 'push' && 'https://spatialdata-spec.pages.dev/' || format('https://pr-{0}.spatialdata-spec.pages.dev/', github.event.pull_request.number) }}
    steps:
      - name: Check out the website code (this commit, or site for history-draft)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.content && 'site' || '' }}
          persist-credentials: false
      - name: Check out the content (history-draft, or this commit for history-draft)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ !inputs.content && 'history-draft' || '' }}
          path: .draft
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false # no cache in a job that deploys
      - name: Write each version of the content and list it in versions.toml
        run: |
          python .draft/tools/write_history.py --out _draft
          python - <<'EOF'
          import re
          from pathlib import Path

          text = Path("versions.toml").read_text()
          # each version built from its directory written by write_history.py instead of its tag
          text = re.sub(r'(storage_format = "([^"]+)")', r'\1\nsource = "_draft/\2"', text)
          Path("_draft/versions.toml").write_text(text)
          EOF
      - name: Build every version in versions.toml
        run: uv run build.py --versions _draft/versions.toml
      - name: Keep the deployment out of search engines # Cloudflare does this only for pull requests
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > _site/_headers
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 pages deploy _site --project-name=spatialdata-spec --branch="$BRANCH"
