name: Test

on:
  push:
    branches: [main]
  # Every pull request, including those stacked on another pull request's branch.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - &clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - &setup-uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv tool install hatch
      - run: uvx prek run --all-files --show-diff-on-failure --color=always

  # Builds this checkout with the website code of the `site` branch, as a preview.
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - *clone
      - name: Check out the website code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: site
          path: .site
          persist-credentials: false
      - *setup-uv
      - name: Build docs (warnings treated as errors)
        env:
          PR: ${{ github.event.pull_request.number }}
        run: uv run --project .site .site/build.py --source . --out _site --pr "$PR"
      - name: Generate the pages of main and build the newest version (warnings treated as errors)
        run: |
          python3 tools/write_history.py --out _main
          newest=$(ls _main | sort -V | tail -n 1)
          uv run --project .site .site/build.py --source "_main/$newest" --out _site_main
      # Download the artifact from the run summary and open preview/index.html.
      - name: Upload built site
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-html
          path: _site/preview/
          if-no-files-found: error
          retention-days: 14
      - name: Point to the preview artifact
        run: echo "Built site uploaded as the **site-html** artifact of this run (download, unzip, open index.html)." >> "$GITHUB_STEP_SUMMARY"
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}

  # Links the built site from the pull request, in one comment that each run updates. Pull requests
  # from forks get a read-only token and are skipped; their run summary still has the artifact.
  preview:
    name: Link the site preview
    needs: docs
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ needs.docs.outputs.artifact-url }}
        run: |
          body="<!-- site-preview -->
          **Site preview** for ${SHA::7}: [download \`site-html\`]($URL), unzip, and open \`index.html\`.
          Kept for 14 days; updated on every push."
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- site-preview -->"))) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

  # Check that all jobs above pass. This makes it easy to set a single "required" check in branch
  # protection instead of having to update it frequently. See https://github.com/re-actors/alls-green#why.
  check:
    name: All checks pass
    if: always()
    needs:
      - lint
      - docs
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
