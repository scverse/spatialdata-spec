name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - &clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - &setup-uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv tool install hatch
      - run: uvx prek run --all-files --show-diff-on-failure --color=always

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - *clone
      - *setup-uv
      - name: Build docs (warnings treated as errors)
        run: uvx hatch run docs:build
      # Interim preview while the repository is private and Read the Docs cannot build it:
      # download the artifact from the run summary and open index.html.
      - name: Upload built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-html
          path: docs/_build/html/
          if-no-files-found: error
          retention-days: 14
      - name: Point to the preview artifact
        run: echo "Built site uploaded as the **site-html** artifact of this run (download, unzip, open index.html)." >> "$GITHUB_STEP_SUMMARY"

  # Check that all jobs above pass. This makes it easy to set a single "required" check in branch
  # protection instead of having to update it frequently. See https://github.com/re-actors/alls-green#why.
  check:
    name: All checks pass
    if: always()
    needs:
      - lint
      - docs
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
