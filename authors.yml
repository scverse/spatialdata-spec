# Editors, authors and contributors of the SpatialData storage format specification.
#
# people:
#   role: editor       maintains the specification text; also an author.
#         author       named under the title and, with the editors, in the citation of this
#                      version (CITATION.cff, Zenodo); basis says why.
#         contributor  acknowledged by name with their contribution.
#   basis: original design  designed SpatialData (original_design); named under the title.
#   part: specification  worked on this specification itself (writing, reviewing, RFCs).
#         origins        built the SpatialData design, format or implementation it is based on.
#   Authors are listed under the title in file order: the first editor first, the last last.
# groups: people acknowledged together through a link (the SpatialData paper, the code
#         contributors of the spatialdata package) rather than one by one.
#
# Policy:
# - The authors of a version are, each once they agree, its editors, the original designers of
#   SpatialData, and the authors of the accepted RFCs and of substantial changes to the normative
#   text (agreed by the editors) that it includes. They stay authors of later versions while their
#   work remains. Making someone an author needs their approval of the pull request.
# - Each release names its editors, authors and contributors in its own copy of this file (on
#   its tag); that copy is not changed afterwards.
# - Reviewers and people who gave input are contributors.
# - Editors are added or removed in a pull request agreed by the current editors. Anyone is
#   listed only with their agreement and can ask to change their entry or to be removed.
version: 1
original_design:  # who 'basis: original design' refers to
  citation: "Marconato et al., 2025"
  url: https://doi.org/10.1038/s41592-024-02212-x
people:
  - name: "Jan Gleixner"
    github: jan-glx
    orcid: 0000-0001-5006-7375
    role: editor
    part: specification
    contributions: >-
      Assembled and organized the standalone specification from the design doc, documentation and
      implementation of spatialdata; set up the RFC process.
  - name: "Giovanni Palla"
    github: giovp
    orcid: 0000-0002-8004-4462
    role: author
    basis: original design
    part: origins
    contributions: >-
      Designed and authored the spatialdata library and its storage specification; wrote the first
      writer and the format versioning, unified shapes and polygons, added the images and labels
      elements and the OMERO metadata; co-authored the design doc.
  - name: "Kevin A. Yamauchi"
    github: kevinyamauchi
    orcid: 0000-0002-7818-1388
    role: author
    basis: original design
    part: origins
    contributions: >-
      Designed and authored the spatialdata library and its storage specification; wrote the first
      draft of the design doc.
  - name: "Isaac Virshup"
    github: ivirshup
    orcid: 0000-0002-1710-8945
    role: author
    basis: original design
    part: origins
    contributions: >-
      Designed and authored the spatialdata library and its storage specification.
  - name: "Josh Moore"
    github: joshmoore
    orcid: 0000-0003-4028-811X
    role: author
    basis: original design
    part: origins
    contributions: >-
      Co-authored the spatialdata storage specification (alignment with OME-NGFF).
  - name: "Tim Treis"
    github: timtreis
    orcid: 0000-0002-9686-4799
    role: contributor
    part: specification
    contributions: >-
      Input on tiled and multiscale points (RFC 3).
  - name: "Ilan Gold"
    github: ilan-gold
    orcid: 0000-0002-5823-1026
    role: contributor
    part: specification
    contributions: >-
      Input on tiled and multiscale points and shapes (RFCs 3 and 4), including the CSR/CSC
      orderings.
  - name: "Wouter-Michiel Vierdag"
    github: melonora
    orcid: 0000-0003-1666-5421
    role: contributor
    part: origins
    contributions: >-
      Added Zarr v3 support, xarray DataTree storage for multiscale rasters, raster compression
      and table validation.
  - name: "Mark Keller"
    github: keller-mark
    orcid: 0000-0003-3003-874X
    role: contributor
    part: origins
    contributions: >-
      Added the geometry encoding for shapes; clarified coordinate-system names and point metadata
      in the design doc.
  - name: "Andreas Eisenbarth"
    github: aeisenbarth
    orcid: 0000-0002-1113-9556
    role: contributor
    part: origins
    contributions: >-
      Added element name validation, partial reading, pyramid writing and labels multiscales;
      edited the design doc.
  - name: "Benjamin Rombaut"
    github: berombau
    orcid: 0000-0002-4022-715X
    role: contributor
    part: origins
    contributions: >-
      Added consolidated metadata for remote Zarr stores.
  - name: "Arne Defauw"
    github: ArneDefauw
    orcid: 0000-0003-1946-9178
    role: contributor
    part: origins
    contributions: >-
      Added OME-Zarr chunking for rasters.
  - name: "Theodoros Visvikis"
    github: Tomatokeftes
    orcid: 0009-0003-5579-5488
    role: contributor
    part: origins
    contributions: >-
      Made sure AnnData encoding metadata is kept in the table group.
  - name: "Ajayrama Kumaraswamy"
    github: ajkswamy
    orcid: 0000-0001-7928-877X
    role: contributor
    part: origins
    contributions: >-
      Made obs/var strings be written as categoricals.
  - name: "Luca Marconato"
    github: LucaMarconato
    orcid: 0000-0003-3198-1326
    role: editor
    basis: original design
    part: specification
    contributions: >-
      Co-edited and reviewed the specification; designed and authored the spatialdata library and
      its storage specification; wrote most of the format (transformations/coordinate systems IO,
      Parquet points, multiple tables, GeoParquet shapes, NGFF 0.6 output); main author of the
      design doc; drew the element overview, coordinate-system and transformation figures.
groups:
  - name: "Authors of the SpatialData paper"
    url: https://doi.org/10.1038/s41592-024-02212-x
    part: origins
    contributions: >-
      Introduced the SpatialData framework, data model and storage format (Marconato et al.,
      Nature Methods 2025).
  - name: "Contributors to the spatialdata Python package"
    url: https://github.com/scverse/spatialdata/graphs/contributors
    part: origins
    contributions: >-
      Developed the original Python `spatialdata` package, from whose design and implementation
      the specifications were derived.
