# This repository is a specification, not a distributable library. The website code is on the
# `site` branch; the hatch scripts below build this checkout with it (see docs/contributing.md).
[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "spatialdata-spec"
version = "0.0.1"
description = "SpatialData format specification"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Luca Marconato", email = "luca.marconato@scverse.org" },
]
authors = [
  { name = "scverse" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://scverse.github.io/spatialdata-spec/"
urls.Homepage = "https://github.com/scverse/spatialdata-spec"
urls.Source = "https://github.com/scverse/spatialdata-spec"

[tool.hatch]
# Metadata-only project: nothing to select for the wheel.
build.targets.wheel.bypass-selection = true
envs.default.installer = "uv"
# The site branch, checked out next to this repository (git worktree add ../spatialdata-spec-site site).
envs.docs.detached = true
envs.docs.scripts.build = """\
  uv run --project {env:SITE_DIR:../spatialdata-spec-site} {env:SITE_DIR:../spatialdata-spec-site}/build.py --source . \
  --out _site {args}\
  """
envs.docs.scripts.clean = "git clean -fdX -- _site"
envs.docs.scripts.open = "python -c \"import pathlib, webbrowser; webbrowser.open(pathlib.Path('_site/preview/index.html').resolve().as_uri())\""

[tool.ruff]
line-length = 120
format.docstring-code-format = true
lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Function calls in argument defaults are fine when the result is immutable.
  "E501", # line too long -> handled by the formatter
  "E731", # lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names
]
lint.per-file-ignores."docs/*" = [ "I" ]

[tool.cruft]
skip = [
  ".git",
  "tests",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
]
