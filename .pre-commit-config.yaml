fail_fast: false
default_language_version:
  python: python3
default_stages:
  - pre-commit
  - pre-push
minimum_pre_commit_version: 2.16.0
repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.11
    hooks:
      - id: biome-format
        # .cruft.json: inconsistent indentation with cruft, never modified manually.
        # conformance/fingerprints: machine-written by generate_fingerprint.py, keep its canonical formatting.
        exclude: ^(\.cruft\.json|conformance/fingerprints/.*\.json)$
        groups: [format]
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.28.1
    hooks:
      - id: pyproject-fmt
        groups: [format]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        groups: [format]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-ast
      - id: end-of-file-fixer
        groups: [format]
      - id: mixed-line-ending
        args: [--fix=lf]
        groups: [format]
      - id: trailing-whitespace
        groups: [format]
      - id: check-case-conflict
      # Check that there are no merge conflicts (could be generated by template sync)
      - id: check-merge-conflict
        args: [--assume-in-merge]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]
