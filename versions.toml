# Versions of the specification published on the website, newest first.
#
# Each version is a tag storage-format-<version> of the branch main, which holds exactly one
# version of the specification: a storage format version and the version of the abstract data
# model it encodes. Each is built with the website code of this branch, at
# data-model/<data_model>/storage-format/<storage_format>/; data-model/<data_model>/ leads to the
# newest storage format of that data model. In-memory formats will sit next to the storage format
# under their data model version (data-model/<data_model>/python/<version>/).
#
#   ref             branch or tag the content comes from
#   data_model      version of the abstract data model
#   storage_format  storage format version
#   draft           true for a version still under development (shows the draft banner)
#   preferred       the version the site root leads to (exactly one)
#
# Never change the data model or storage format of a published version: its path is part of
# every permalink.

[[version]]
ref = "storage-format-0.4"
data_model = "1.0"
storage_format = "0.4"
preferred = true

[[version]]
ref = "storage-format-0.3"
data_model = "1.0"
storage_format = "0.3"

[[version]]
ref = "storage-format-0.2"
data_model = "1.0"
storage_format = "0.2"

[[version]]
ref = "storage-format-0.1"
data_model = "1.0"
storage_format = "0.1"
