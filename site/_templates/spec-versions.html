{#- The versions of the specification, for js/spec-versions.js, which lists them in the main
    navigation below the entries of the abstract data model and the storage format. These are the
    versions known when this page was built; the script refreshes them from versions.json. -#}
<script type="application/json" class="spec-versions"
        data-versions-url="{{ spec_site_url }}versions.json" data-page="{{ pagename }}"
        data-data-model="{{ spec_data_model }}" data-storage-format="{{ spec_storage_format }}">
{{ spec_versions | tojson }}
</script>
